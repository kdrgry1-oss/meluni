# meluni — nginx
#
#   meluni.com.tr      → React derlemesi (statik)
#   api.meluni.com.tr  → FastAPI (127.0.0.1:8000)
#
# Kurulum:
#   sudo cp deploy/nginx.meluni.conf /etc/nginx/sites-available/meluni
#   sudo nano /etc/nginx/sites-available/meluni      # <KULLANICI> düzenle
#   sudo ln -sf /etc/nginx/sites-available/meluni /etc/nginx/sites-enabled/meluni
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# SERTIFIKA — iki secenek:
#
#  A) Let's Encrypt (onerilen, Cloudflare'e bagimli degil):
#       sudo apt install -y certbot python3-certbot-nginx
#       sudo certbot --nginx -d meluni.com.tr -d www.meluni.com.tr -d api.meluni.com.tr
#     certbot asagidaki ssl_certificate satirlarini KENDISI /etc/letsencrypt
#     yollariyla degistirir ve otomatik yenilemeyi kurar. Sertifika alinirken
#     Cloudflare proxy'si GRI olmali (HTTP-01 dogrulamasi origin'e ulasmali);
#     alindiktan sonra turuncuya cevirebilirsiniz.
#
#  B) Cloudflare Origin Certificate:
#     SSL/TLS > Origin Server > Create Certificate. Yalniz zone "Active"
#     iken calisir; "Pending Nameserver Update" durumunda Origin CA hicbir
#     hostname'i dogrulamaz ve "zone is not part of your account" hatasi verir.

# Cloudflare proxy'si arkasında $remote_addr Cloudflare'in IP'sidir.
# Bu blok olmadan tüm loglarınız ve IP bazlı kurallarınız anlamsız olur.
# Güncel liste: https://www.cloudflare.com/ips/
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# ── HTTP → HTTPS ────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name meluni.com.tr www.meluni.com.tr api.meluni.com.tr;

    # ACME dogrulamasi HTTPS'e yonlendirilmemeli, yoksa sertifika alinamaz.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── www → köksüz adres ──────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.meluni.com.tr;

    ssl_certificate     /etc/ssl/cloudflare/meluni.pem;
    ssl_certificate_key /etc/ssl/cloudflare/meluni.key;

    return 301 https://meluni.com.tr$request_uri;
}

# ── Storefront (React) ──────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name meluni.com.tr;

    # certbot kullaniyorsaniz bu iki satiri certbot kendisi degistirir:
    #   /etc/letsencrypt/live/meluni.com.tr/fullchain.pem
    #   /etc/letsencrypt/live/meluni.com.tr/privkey.pem
    ssl_certificate     /etc/ssl/cloudflare/meluni.pem;
    ssl_certificate_key /etc/ssl/cloudflare/meluni.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Let's Encrypt yenileme dogrulamasi (HTTP-01). Bu blok olmadan certbot
    # yenileyemez; yenileme sessizce basarisiz olur ve 90 gun sonra site duser.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    root /home/<KULLANICI>/apps/meluni/current/frontend/build;
    index index.html;

    # Deploy her release'de "current" symlink'ini çevirir; nginx'in eski
    # dosyayı açık tutmaması için disk cache'i kapalı.
    open_file_cache off;

    access_log /var/log/nginx/meluni.access.log;
    error_log  /var/log/nginx/meluni.error.log;

    client_max_body_size 25m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ~ /\. { deny all; }

    # index.html ASLA cache'lenmez: yeni derlemede dosya adları değişir,
    # eski index.html silinmiş JS dosyalarını ister ve site beyaz ekran olur.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Hash'li varlıklar sonsuza dek cache'lenebilir.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # React Router: diskte olmayan yollar index.html'e düşer.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── API (FastAPI) ───────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.meluni.com.tr;

    ssl_certificate     /etc/ssl/cloudflare/meluni.pem;
    ssl_certificate_key /etc/ssl/cloudflare/meluni.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/meluni-api.access.log;
    error_log  /var/log/nginx/meluni-api.error.log;

    # Ürün görseli / Excel içe aktarma yüklemeleri için geniş sınır.
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # XML içe aktarma (6475 ürün) uzun sürer; varsayılan 60 sn yetmez.
        proxy_read_timeout    600s;
        proxy_connect_timeout 30s;
        proxy_buffering       off;
    }
}
