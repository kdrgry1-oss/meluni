name: Backend → Railway

# Backend'i Railway'e deploy eder. Yalnizca backend/ degistiginde calisir,
# frontend commit'lerinde bosuna deploy tetiklenmez.
#
# Gerekli repository secret:
#   RAILWAY_TOKEN    - Railway > Project Settings > Tokens (project token)
# Opsiyonel:
#   RAILWAY_SERVICE  - hedef servis adi (tek servisli projede gerekmez)

# NOT: Barindirma kendi sunucumuzda (bkz. deploy.yml). Bu akis ALTERNATIF
# yoldur ve otomatik tetiklenmez; yalniz Actions > Run workflow ile calisir.
on:
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Railway deploy
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Bagimliliklari kur
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Uygulama ayaga kalkiyor mu
        # Import hatasi / eksik bagimlilik deploy'a gitmeden burada patlar.
        # Railway'de patlarsa canli servis asagi iner; burada patlarsa inmez.
        working-directory: backend
        env:
          MONGO_URL: mongodb://localhost:27017
          SECRETS_MASTER_KEY: ${{ secrets.CI_DUMMY_MASTER_KEY }}
        run: python -c "import server; print('router sayisi:', len(server.app.routes))"

      - name: Railway'e gonder
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN}" ]; then
            echo "::error::RAILWAY_TOKEN secret'i tanimli degil."
            exit 1
          fi
          npm install -g @railway/cli
          if [ -n "${RAILWAY_SERVICE}" ]; then
            railway up --service "${RAILWAY_SERVICE}" --detach
          else
            railway up --detach
          fi
