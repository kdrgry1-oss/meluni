  remove_empty_mongo_url:
    if: inputs.task == 'remove-empty-mongo-url' && github.ref == 'refs/heads/codex/meluni-publish-images-20261110'
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - name: Remove only empty Mongo URL line
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_meluni_publish"
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null
          fi
          APP_ROOT="${DEPLOY_PATH:-/home/${SSH_USER}/apps/meluni}"
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/id_meluni_publish" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" bash -s -- "$APP_ROOT" <<'REMOTE'
          set -euo pipefail
          env_file="$1/shared/.env"
          test -f "$env_file"
          python3 - "$env_file" <<'PY'
          import os, pathlib, sys, tempfile, datetime
          p = pathlib.Path(sys.argv[1])
          raw = p.read_bytes()
          lines = raw.splitlines(keepends=True)
          target = [i for i, line in enumerate(lines) if line.startswith(b'MONGO_URL=')]
          if not target:
              print('Mongo URL setting already absent; no change made.')
              raise SystemExit(0)
          if len(target) != 1:
              raise SystemExit('Multiple Mongo URL settings; no change made.')
          i = target[0]
          suffix = datetime.datetime.now(datetime.timezone.utc).strftime('%Y%m%dT%H%M%SZ')
          backup = p.with_name(p.name + '.before-mongo-removal-' + suffix)
          backup.write_bytes(raw)
          os.chmod(backup, p.stat().st_mode & 0o777)
          with tempfile.NamedTemporaryFile(dir=p.parent, prefix=p.name + '.', delete=False) as f:
              f.write(b''.join(line for j, line in enumerate(lines) if j != i))
              temp = pathlib.Path(f.name)
          os.chmod(temp, p.stat().st_mode & 0o777)
          temp.replace(p)
          print('Removed only Mongo URL setting; backup retained.')
          PY
          REMOTE
