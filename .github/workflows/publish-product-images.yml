permissions:
  contents: write

concurrency:
  group: meluni-publish-images
  cancel-in-progress: false

jobs:
  restore_mongo_url:
    if: inputs.task == 'restore-mongo-url' && github.ref == 'refs/heads/codex/meluni-publish-images-20261110'
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - name: Restore original Mongo URL line from server backup
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_meluni_publish"
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null
          fi
          APP_ROOT="${DEPLOY_PATH:-/home/${SSH_USER}/apps/meluni}"
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/id_meluni_publish" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" python3 - "$APP_ROOT/shared/.env" <<'PY'
          import pathlib, sys, os, tempfile
          p=pathlib.Path(sys.argv[1]); current=p.read_bytes()
          backups=sorted(p.parent.glob(p.name+'.before-mongo-removal-*'))
          if not backups: raise SystemExit('Mongo setting backup not found')
          original=backups[-1].read_bytes()
          lines=original.splitlines(keepends=True)
          matched=[line for line in lines if line.startswith(b'MONGO_URL=')]
          if len(matched)!=1: raise SystemExit('Backup Mongo setting is ambiguous')
          without=b''.join(line for line in lines if not line.startswith(b'MONGO_URL='))
          if current!=without: raise SystemExit('Environment changed since removal; no restoration made')
          with tempfile.NamedTemporaryFile(dir=p.parent,prefix=p.name+'.',delete=False) as f:
              f.write(original); temp=pathlib.Path(f.name)
          os.chmod(temp,p.stat().st_mode & 0o777)
          temp.replace(p)
          print('Original Mongo URL setting restored; all other settings unchanged.')
          PY
  inspect_catalog:
    if: inputs.task == 'inspect-catalog' && github.ref == 'refs/heads/codex/meluni-publish-images-20261110'
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - name: Inspect live catalog storage read only
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_meluni_publish"
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > "$HOME/.ssh/known_hosts" 2>/dev/null
          fi
          APP_ROOT="${DEPLOY_PATH:-/home/${SSH_USER}/apps/meluni}"
          ssh -p "$SSH_PORT" -i "$HOME/.ssh/id_meluni_publish" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" bash -s -- "$APP_ROOT" <<'REMOTE'
          set -euo pipefail
          root="$1"
          printf 'App service: '; systemctl is-active meluni 2>/dev/null || true
          printf 'API response: '; curl -sS -o /dev/null -w '%{http_code}\n' --max-time 5 http://127.0.0.1:8000/api/health || true
          printf 'Local product endpoint: '; curl -sS -o /tmp/meluni-catalog-inspect.json -w '%{http_code}\n' --max-time 8 'http://127.0.0.1:8000/api/products?limit=1' || true
          python3 - <<'PY'
          import json
          try:
              d=json.load(open('/tmp/meluni-catalog-inspect.json'))
              print('Local product count:', d.get('total'), 'first id:', (d.get('products') or [{}])[0].get('id'))
          except Exception as e:
              print('Local product parse:', type(e).__name__)
