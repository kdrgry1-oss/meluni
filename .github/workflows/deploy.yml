name: Deploy

# meluni — kendi sunucumuza (SSH) deploy. GitHub'a push → sunucuda canlı.
#
# Akış: frontend runner'da derlenir → derleme + backend kaynağı tek paket
# hâlinde sunucuya gider → systemd servisi yeniden başlar → sağlık kontrolü.
# Sağlık kontrolü geçmezse deploy.sh önceki release'e geri döner.
#
# Gerekli repository secret'ları (Settings > Secrets and variables > Actions):
#   SSH_HOST              sunucu IP (83.150.214.157)
#   SSH_USER              deploy kullanıcısı (kadir)
#   SSH_PRIVATE_KEY       deploy için üretilmiş ÖZEL anahtar (parolasız)
#   SSH_KNOWN_HOSTS       `ssh-keyscan -H <ip>` çıktısı
#   REACT_APP_BACKEND_URL https://api.meluni.com.tr
# Opsiyonel:
#   SSH_PORT (22), DEPLOY_PATH, REACT_APP_SITE_NAME/_SITE_URL

on:
  push:
    branches:
      - main
      - master
      - claude/meluni-entegrasyon-rzv2le
  workflow_dispatch:
    inputs:
      ref:
        description: "Deploy edilecek git ref (boş bırakılırsa mevcut branch)"
        required: false
        default: ""

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Sunucuya deploy
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    steps:
      - name: Kodu al
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Gerekli secret'ları doğrula
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "$SSH_HOST" ] || missing="$missing SSH_HOST"
          [ -n "$SSH_USER" ] || missing="$missing SSH_USER"
          [ -n "$SSH_PRIVATE_KEY" ] || missing="$missing SSH_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Eksik repository secret'ları:$missing — bkz. docs/SUNUCU-KURULUM.md"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Frontend bağımlılıkları
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Frontend derle
        working-directory: frontend
        env:
          # CRA bu değerleri DERLEME ANINDA gömer; sunucuda değiştirilemez.
          REACT_APP_BACKEND_URL: ${{ secrets.REACT_APP_BACKEND_URL }}
          REACT_APP_SITE_NAME: ${{ secrets.REACT_APP_SITE_NAME }}
          REACT_APP_SITE_URL: ${{ secrets.REACT_APP_SITE_URL }}
          REACT_APP_SITE_TITLE: ${{ secrets.REACT_APP_SITE_TITLE || 'Meluni | Kadın ve Erkek Giyim' }}
          REACT_APP_SITE_DESC: ${{ secrets.REACT_APP_SITE_DESC || 'Meluni kadın ve erkek sonbahar koleksiyonu.' }}
          REACT_APP_CDN_URL: ${{ secrets.REACT_APP_CDN_URL || secrets.REACT_APP_SITE_URL || 'https://meluni.com.tr' }}
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -euo pipefail
          if [ -z "${REACT_APP_BACKEND_URL}" ]; then
            echo "::error::REACT_APP_BACKEND_URL secret'ı boş — frontend API'ye ulaşamaz."
            exit 1
          fi
          yarn build
          test -f build/index.html || { echo "::error::build/index.html üretilmedi"; exit 1; }

          # CRA degiskeni DERLEME ANINDA gomer. Kabukta "VAR=x cmd1 && cmd2"
          # yazildiginda VAR yalniz cmd1'e gecer; boyle bir hatada derleme
          # sessizce API adressiz cikar ve site "giris yapilamiyor" der.
          # Adresin gercekten gomuldugunu dogruluyoruz.
          host="$(printf '%s' "${REACT_APP_BACKEND_URL}" | sed -e 's|^https\?://||' -e 's|/.*$||')"
          if ! grep -rqF "${host}" build/static/js/; then
            echo "::error::REACT_APP_BACKEND_URL (${host}) derlemeye gomulmemis — paket bozuk, deploy durduruldu."
            exit 1
          fi
          echo "API adresi derlemede dogrulandi: ${host}"
          echo "derleme boyutu: $(du -sh build | cut -f1)"

      - name: SSH anahtarını hazırla
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::SSH_KNOWN_HOSTS tanımlı değil; host anahtarı doğrulanmadan alınıyor."
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 644 ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SSH_KEY: /home/runner/.ssh/id_deploy
          # Derleme çıktısı git'te izlenmiyor; pakete elle ekletiyoruz.
          EXTRA_PATHS: frontend/build
        run: |
          set -euo pipefail
          chmod +x scripts/deploy.sh
          [ -n "${DEPLOY_PATH}" ] || unset DEPLOY_PATH
          ./scripts/deploy.sh

      - name: Anahtarı temizle
        if: always()
        run: rm -f ~/.ssh/id_deploy
